<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日待辦清單</title>
<style>
  :root {
    --bg: #f4f1ec; --card: #fff; --text: #2b2b2b; --muted: #8a857d;
    --accent: #4f7f6b; --accent-soft: #e3eee9; --line: #ebe7e0; --danger: #c0574a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1c1a; --card: #262825; --text: #ecebe7; --muted: #948f86;
      --accent: #7fb59d; --accent-soft: #30403a; --line: #363833; --danger: #e07d70; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px; min-height: 100vh; }
  .app { width: 100%; max-width: 520px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  header h1 { white-space: nowrap; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav button { white-space: nowrap; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card);
    color: var(--text); border-radius: 8px; padding: 6px 12px; }
  button:hover { border-color: var(--accent); }
  h1 { font-size: 1.5rem; margin: 0; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .progress { height: 8px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .stat { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin: 8px 0 14px; }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text] { flex: 1; font: inherit; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); min-width: 0; }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  form button { background: var(--accent); color: #fff; border: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: none; }
  li input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
  li span { flex: 1; word-break: break-word; cursor: text; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  li .del { border: none; background: none; color: var(--muted); padding: 2px 8px; font-size: 1.1rem; }
  li .del:hover { color: var(--danger); }
  li input.edit { flex: 1; font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--bg); color: var(--text); }
  :root { --p-high: #d0554a; --p-mid: #d9a03f; --p-low: #58b368; }
  select { font: inherit; padding: 10px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); }
  li { border-left: 4px solid transparent; padding-left: 10px; }
  li.p-high { border-left-color: var(--p-high); }
  li.p-mid { border-left-color: var(--p-mid); }
  li.p-low { border-left-color: var(--p-low); }
  li.done { opacity: .6; }
  li .pri { width: 16px; height: 16px; padding: 0; border-radius: 50%; border: none; flex-shrink: 0; }
  li .pri.high { background: var(--p-high); }
  li .pri.mid { background: var(--p-mid); }
  li .pri.low { background: var(--p-low); }
  #weekly[hidden] { display: none; }
  #wkBtn { white-space: nowrap; }
  #wkBtn[aria-expanded=true], #calBtn[aria-expanded=true] { background: var(--accent-soft); border-color: var(--accent); }
  #cal { margin-bottom: 14px; }
  #cal[hidden] { display: none; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head strong { font-size: 1rem; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-grid .wd { font-size: .75rem; color: var(--muted); padding: 4px 0; }
  .cal-grid button { position: relative; border: none; background: none; padding: 8px 0; border-radius: 8px; font-size: .9rem; }
  .cal-grid button:hover { background: var(--accent-soft); }
  .cal-grid button.today { color: var(--accent); font-weight: 700; }
  .cal-grid button.sel { background: var(--accent); color: #fff; }
  .cal-grid button.has::after { content: ""; position: absolute; bottom: 3px; left: 50%; width: 5px; height: 5px;
    margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
  .cal-grid button.sel.has::after { background: #fff; }
  .cal-grid button.has.pending::after { background: var(--p-high); }
  .cal-grid button.sel.has.pending::after { background: #fff; }
  #weekly { margin-top: 14px; }
  .wk-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .wk-head span { font-size: .85rem; color: var(--muted); }
  #wList li { flex-wrap: wrap; }
  #wList .st { border: none; background: none; font-size: 1.3rem; padding: 0 2px; color: var(--accent); line-height: 1; flex-shrink: 0; }
  .wsub { flex-basis: 100%; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-left: 32px; margin-top: -4px; }
  .wsub .chip { font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); border: none; }
  .wsub .tag { font-size: .75rem; color: var(--muted); }
  .wsub select { font-size: .75rem; padding: 2px 6px; }
  #comments { margin-top: 14px; }
  #openComment { width: 100%; background: var(--accent); color: #fff; border: none; padding: 10px; }
  #commentList { margin-top: 4px; }
  #commentList li { display: block; border-left: none; padding: 12px 4px; }
  #commentList .who { font-weight: 700; font-size: .9rem; }
  #commentList .when { color: var(--muted); font-size: .75rem; margin-left: 8px; font-weight: 400; }
  #commentList .txt { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  dialog { border: none; border-radius: 14px; padding: 20px; width: min(420px, calc(100vw - 32px));
    background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog form { display: block; margin: 0; }
  dialog form button { background: var(--card); color: var(--text); border: 1px solid var(--line); white-space: nowrap; }
  dialog form button.primary { background: var(--accent); color: #fff; border: none; }
  dialog h2 { margin: 0 0 16px; font-size: 1.2rem; white-space: nowrap; }
  dialog label { display: grid; grid-template-columns: 3.5em 1fr; align-items: start; gap: 8px;
    font-size: .95rem; color: var(--text); margin-bottom: 14px; white-space: nowrap; }
  dialog label > span { padding-top: 10px; }
  dialog input, dialog textarea { display: block; width: 100%; min-width: 0; font: inherit; padding: 10px 12px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); resize: vertical; }
  dialog input:focus, dialog textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .dlg-actions .primary { background: var(--accent); color: #fff; border: none; }
  #game { margin-top: 14px; }
  .gmain { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #plant { width: 190px; height: 225px; flex-shrink: 0; }
  .ginfo { flex: 1; min-width: 150px; }
  .ginfo .gstage { font-size: 1.15rem; font-weight: 700; }
  .ginfo .gline { font-size: .85rem; color: var(--muted); margin: 4px 0; }
  .ginfo .progress { margin: 8px 0; }
  #gmsg { min-height: 1.3em; color: var(--accent); font-size: .9rem; font-weight: 600; }
  #harvest { background: var(--accent); color: #fff; border: none; margin-top: 6px; }
  #harvest[hidden] { display: none; }
  #garden { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  #garden .gt { width: 100%; font-size: .85rem; color: var(--muted); }
  #garden svg { width: 38px; height: 38px; }
  .can, .drop { opacity: 0; }
  .pour .can { animation: tilt 1.5s ease-in-out; transform-origin: 160px 44px; }
  .pour .drop { animation: fall .9s ease-in; }
  @keyframes tilt { 0% { opacity: 0; transform: rotate(0); } 15% { opacity: 1; transform: rotate(0); }
    30%, 75% { opacity: 1; transform: rotate(-25deg); } 100% { opacity: 0; transform: rotate(0); } }
  @keyframes fall { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; }
    100% { opacity: 0; transform: translateY(135px); } }
  .pop { animation: pop .6s ease-out; transform-origin: 110px 196px; }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .modes { display: flex; gap: 6px; margin-bottom: 12px; }
  .modes button { font-size: .88rem; white-space: nowrap; }
  .modes button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  #monthView { display: none; }
  body.month .app { max-width: 980px; }
  body.month #monthView { display: block; }
  body.month .listonly, body.month .nav, body.month #weekly, body.month #cal, body.month #game { display: none !important; }
  .mhead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .mhead strong { flex: 1; text-align: center; font-size: 1.1rem; }
  .mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .mwd { background: var(--card); text-align: center; font-size: .8rem; color: var(--muted); padding: 6px 0; }
  .mcell { min-height: 100px; padding: 4px; background: var(--card); border: none; border-radius: 0; text-align: left;
    display: flex; flex-direction: column; gap: 2px; align-items: stretch; cursor: pointer; color: var(--text); font: inherit; }
  .mcell:hover { background: var(--accent-soft); }
  .mcell.out { opacity: .45; }
  .mcell .dn { font-size: .8rem; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; }
  .mcell.today .dn { background: var(--accent); color: #fff; font-weight: 700; }
  .ev { display: block; font-size: .72rem; background: var(--accent-soft); color: var(--accent); border-radius: 4px;
    padding: 1px 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more { font-size: .7rem; color: var(--muted); padding-left: 4px; }
  @media (max-width: 560px) {
    .mcell { min-height: 68px; padding: 2px; }
    .ev { font-size: .6rem; padding: 0 2px; }
  }
  #dayDialog h2 { margin: 0 0 8px; }
  #dList { margin-bottom: 12px; max-height: 40vh; overflow-y: auto; }
  #dList li { border-left: none; padding-left: 4px; }
  #dList .etime { flex: none; color: var(--muted); font-size: .85rem; min-width: 3em; }
  #dList .empty { padding: 12px 0; }
  #dForm { display: flex !important; gap: 6px; margin: 0 0 12px !important; }
  #dForm input { width: auto; }
  #dForm #dTime { flex: none; width: 105px; padding: 8px; }
  #dForm #dText { flex: 1; min-width: 0; }
  #dForm button[type=submit] { background: var(--accent); color: #fff; border: none; }
  .projbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
  .pchip { border-radius: 99px; padding: 4px 14px; font-size: .88rem; white-space: nowrap; }
  .pchip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pchip.add { color: var(--muted); border-style: dashed; }
  .pmini { border: none; background: none; color: var(--muted); font-size: .8rem; padding: 4px 6px; white-space: nowrap; }
  .pmini:hover { color: var(--accent); border: none; }
  .pmini.danger:hover { color: var(--danger); }
  .projbar form.pform { display: flex; margin: 0; gap: 6px; }
  .pform input[type=text] { flex: none; width: 130px; padding: 5px 10px; }
  .pform button { padding: 4px 12px; font-size: .85rem; }
  .pform .plain { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .ptag { font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent);
    border: none; max-width: 7em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
  .ptag.none { background: var(--bg); color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .actions button { font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📝 每日待辦</h1>
    <div class="nav">
      <button id="wkBtn" aria-expanded="false" aria-controls="weekly" aria-label="顯示週計畫">🗓️ 週計畫</button>
      <button id="calBtn" aria-expanded="false" aria-controls="cal" aria-label="顯示日曆">📅</button>
      <button id="prev" aria-label="前一天">‹</button>
      <button id="today">今天</button>
      <button id="next" aria-label="後一天">›</button>
    </div>
  </header>
  <div class="sub" id="dateLabel"></div>
  <div class="modes" role="group" aria-label="檢視模式">
    <button id="modeList" aria-pressed="true">📝 清單模式</button>
    <button id="modeMonth" aria-pressed="false">🗓️ 月曆模式</button>
  </div>
  <div class="projbar listonly" id="projBar" aria-label="專案"></div>

  <div class="card" id="monthView">
    <div class="mhead">
      <button id="mPrev" aria-label="上個月">‹</button>
      <strong id="mTitle"></strong>
      <button id="mNext" aria-label="下個月">›</button>
      <button id="mToday">今天</button>
    </div>
    <div class="mgrid" id="mGrid"></div>
  </div>

  <div class="card" id="cal" hidden>
    <div class="cal-head">
      <button id="calPrev" aria-label="上個月">‹</button>
      <strong id="calTitle"></strong>
      <button id="calNext" aria-label="下個月">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="card listonly" id="daily">
    <div class="progress"><div id="bar"></div></div>
    <div class="stat"><span id="count"></span><span id="pct"></span></div>
    <form id="form">
      <input type="text" id="input" placeholder="新增待辦事項…" maxlength="200" autocomplete="off">
      <select id="priority" aria-label="優先順序">
        <option value="high" title="高">🔴</option>
        <option value="mid" title="中" selected>🟡</option>
        <option value="low" title="低">🟢</option>
      </select>
      <button type="submit">新增</button>
    </form>
    <ul id="list"></ul>
    <div class="actions">
      <button id="carry">↪ 帶入昨天未完成</button>
      <button id="clearDone">清除已完成</button>
    </div>
  </div>

  <div class="card" id="weekly" hidden>
    <div class="wk-head"><strong id="wkTitle"></strong><span id="wkCount"></span></div>
    <form id="wForm">
      <input type="text" id="wInput" placeholder="這週預計完成…（還沒決定哪天也沒關係）" maxlength="200" autocomplete="off">
      <select id="wPriority" aria-label="優先順序">
        <option value="high" title="高">🔴</option>
        <option value="mid" title="中" selected>🟡</option>
        <option value="low" title="低">🟢</option>
      </select>
      <button type="submit">新增</button>
    </form>
    <ul id="wList"></ul>
    <div class="actions">
      <button id="wCarry">↪ 帶入上週未完成</button>
      <button id="wClear">清除已完成</button>
    </div>
  </div>

  <div class="card" id="game">
    <div class="gmain">
      <svg id="plant" viewBox="0 0 220 260" role="img" aria-label="你的小花"></svg>
      <div class="ginfo">
        <div class="gstage" id="gstage"></div>
        <div class="gline" id="gheight"></div>
        <div class="gline" id="gspecies"></div>
        <div class="progress"><div id="gbar"></div></div>
        <div class="gline" id="gnext"></div>
        <div id="gmsg" aria-live="polite"></div>
        <button id="harvest" hidden>收進花園，種下新種子</button>
      </div>
    </div>
    <div id="garden"></div>
  </div>

  <div class="card" id="comments">
    <button id="openComment">💬 留下評論</button>
  </div>
</div>

<dialog id="dayDialog">
  <h2 id="dTitle"></h2>
  <ul id="dList"></ul>
  <form id="dForm">
    <input type="time" id="dTime" aria-label="時間（可不填）">
    <input type="text" id="dText" placeholder="新增行程…" required maxlength="100" autocomplete="off" aria-label="行程內容">
    <button type="submit">新增</button>
  </form>
  <div class="dlg-actions">
    <button type="button" id="dToList">📝 看這天的待辦</button>
    <button type="button" id="dClose">關閉</button>
  </div>
</dialog>

<dialog id="commentDialog">
  <form id="commentForm" method="dialog">
    <h2>留下評論</h2>
    <label><span>名字</span>
      <input type="text" id="cName" required maxlength="40" autocomplete="name">
    </label>
    <label><span>Email</span>
      <input type="email" id="cEmail" required maxlength="100" autocomplete="email">
    </label>
    <label><span>評論</span>
      <textarea id="cText" required maxlength="1000" rows="5"></textarea>
    </label>
    <div class="dlg-actions">
      <button type="button" id="cCancel">取消</button>
      <button type="submit" class="primary">送出</button>
    </div>
  </form>
</dialog>

<script>
const KEY = "daily-todo-v1";
let data = load();
let current = ymd(new Date());

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
}
function ymd(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function shift(dateStr, n) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return ymd(new Date(y, m - 1, d + n));
}
const tasks = () => (data[current] ||= []);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const RANK = { high: 0, mid: 1, low: 2 };
const LABEL = { high: "高", mid: "中", low: "低" };
const NEXT = { high: "mid", mid: "low", low: "high" };

const $ = id => document.getElementById(id);

/* ---------- 專案 ---------- */
const PKEY = "daily-todo-projects-v1";
let proj = { list: [], sel: "all" };
try {
  const p = JSON.parse(localStorage.getItem(PKEY));
  if (p && Array.isArray(p.list)) proj = { list: p.list, sel: p.sel || "all" };
} catch {}
if (proj.sel !== "all" && !proj.list.some(p => p.id === proj.sel)) proj.sel = "all";
const psave = () => { try { localStorage.setItem(PKEY, JSON.stringify(proj)); } catch {} };
const projName = id => proj.list.find(p => p.id === id)?.name;
const inView = t => proj.sel === "all" || t.project === proj.sel;
let addingProj = false;

// 在「全部」檢視下，點待辦上的專案標籤可依序切換所屬專案
function cycleProject(t, store) {
  const ids = [undefined, ...proj.list.map(p => p.id)];
  const i = ids.indexOf(projName(t.project) ? t.project : undefined);
  t.project = ids[(i + 1) % ids.length];
  store(); render();
}
function projTag(t, store) {
  if (proj.sel !== "all" || !proj.list.length) return null;
  const b = document.createElement("button");
  const n = projName(t.project);
  b.className = "ptag" + (n ? "" : " none");
  b.textContent = n || "未分類";
  b.title = "點擊切換專案";
  b.onclick = () => cycleProject(t, store);
  return b;
}

function renderProjects() {
  const bar = $("projBar");
  bar.innerHTML = "";
  const chip = (label, id) => {
    const b = document.createElement("button");
    b.className = "pchip" + (proj.sel === id ? " on" : "");
    b.textContent = label;
    b.onclick = () => { proj.sel = id; addingProj = false; psave(); render(); };
    bar.append(b);
  };
  chip("全部", "all");
  for (const p of proj.list) chip(p.name, p.id);

  if (addingProj) {
    const f = document.createElement("form");
    f.className = "pform";
    const inp = document.createElement("input");
    inp.type = "text"; inp.maxLength = 20; inp.placeholder = "專案名稱，例如：工作";
    inp.setAttribute("aria-label", "專案名稱");
    const ok = document.createElement("button");
    ok.type = "submit"; ok.textContent = "新增";
    const no = document.createElement("button");
    no.type = "button"; no.className = "plain"; no.textContent = "取消";
    const cancel = () => { addingProj = false; renderProjects(); };
    no.onclick = cancel;
    inp.onkeydown = e => { if (e.key === "Escape") cancel(); };
    f.onsubmit = e => {
      e.preventDefault();
      const v = inp.value.trim();
      if (v) {
        const p = { id: uid(), name: v };
        proj.list.push(p);
        proj.sel = p.id;
      }
      addingProj = false; psave(); render();
    };
    f.append(inp, ok, no);
    bar.append(f);
    inp.focus();
  } else {
    const add = document.createElement("button");
    add.className = "pchip add"; add.textContent = "＋ 新增專案";
    add.onclick = () => { addingProj = true; renderProjects(); };
    bar.append(add);
  }

  if (proj.sel !== "all") {
    const cur = proj.list.find(p => p.id === proj.sel);
    const ren = document.createElement("button");
    ren.className = "pmini"; ren.textContent = "✎ 改名";
    ren.onclick = () => {
      const v = (prompt("專案新名稱", cur.name) || "").trim();
      if (v) { cur.name = v; psave(); render(); }
    };
    const del = document.createElement("button");
    del.className = "pmini danger"; del.textContent = "🗑 刪除專案";
    del.onclick = () => {
      if (!confirm(`刪除專案「${cur.name}」？\n專案裡的待辦會保留，變成「未分類」。`)) return;
      proj.list = proj.list.filter(p => p.id !== cur.id);
      proj.sel = "all";
      psave(); render();
    };
    bar.append(ren, del);
  }
}

let calOpen = false;
let calView = current.slice(0, 7); // "YYYY-MM"

function renderCal() {
  const [y, m] = calView.split("-").map(Number);
  $("calTitle").textContent = `${y} 年 ${m} 月`;
  const grid = $("calGrid");
  grid.innerHTML = "";
  for (const w of "日一二三四五六") {
    const el = document.createElement("div");
    el.className = "wd"; el.textContent = w;
    grid.append(el);
  }
  const first = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  for (let i = 0; i < first; i++) grid.append(document.createElement("div"));
  const todayStr = ymd(new Date());
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const list = data[key] || [];
    const b = document.createElement("button");
    b.textContent = d;
    if (key === todayStr) b.classList.add("today");
    if (key === current) b.classList.add("sel");
    if (list.length) b.classList.add("has");
    if (list.some(t => !t.done)) b.classList.add("pending");
    b.onclick = () => { current = key; render(); };
    grid.append(b);
  }
}

function render() {
  renderMonth();
  if (dayOpen) renderDayList();
  renderProjects();
  $("input").placeholder = proj.sel === "all" ? "新增待辦事項…" : `新增「${projName(proj.sel)}」的待辦…`;
  renderWeekly();
  if (calOpen) {
    if (calView !== current.slice(0, 7)) calView = current.slice(0, 7);
    renderCal();
  }
  const [y, m, d] = current.split("-").map(Number);
  const wd = "日一二三四五六"[new Date(y, m - 1, d).getDay()];
  $("dateLabel").textContent = `${y} 年 ${m} 月 ${d} 日　星期${wd}` + (current === ymd(new Date()) ? "（今天）" : "");

  const all = data[current] || [];
  const list = all.filter(inView);
  const done = list.filter(t => t.done).length;
  const pct = list.length ? Math.round(done / list.length * 100) : 0;
  $("bar").style.width = pct + "%";
  $("count").textContent = `已完成 ${done} / ${list.length}`;
  $("pct").textContent = pct + "%";

  const ul = $("list");
  ul.innerHTML = "";
  if (!list.length) {
    ul.innerHTML = `<div class="empty">${proj.sel === "all" ? "這天還沒有待辦，新增一件吧 ✨" : "這個專案這天還沒有待辦"}</div>`;
    return;
  }
  const sorted = [...list].sort((a, b) =>
    (a.done - b.done) || (RANK[a.priority || "mid"] - RANK[b.priority || "mid"]));
  for (const t of sorted) {
    const p = t.priority || "mid";
    const li = document.createElement("li");
    li.className = "p-" + p + (t.done ? " done" : "");

    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = t.done;
    cb.onchange = () => {
      t.done = cb.checked;
      const water = t.done && !t.watered; // 每件待辦只澆一次水，取消勾選也不會扣水
      if (water) t.watered = true;
      save(); render();
      if (water) waterPlant();
    };

    const span = document.createElement("span");
    span.textContent = t.text;
    span.title = "點兩下編輯";
    span.ondblclick = () => startEdit(li, span, t);

    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.setAttribute("aria-label", "刪除");
    del.onclick = () => { data[current] = all.filter(x => x !== t); save(); render(); };

    const pri = document.createElement("button");
    pri.className = "pri " + p;
    pri.title = `優先順序：${LABEL[p]}（點擊切換）`;
    pri.setAttribute("aria-label", pri.title);
    pri.onclick = () => { t.priority = NEXT[p]; save(); render(); };

    li.append(cb, span);
    const tag = projTag(t, save);
    if (tag) li.append(tag);
    li.append(pri, del);
    ul.append(li);
  }
}

function startEdit(li, span, t, store = save) {
  const inp = document.createElement("input");
  inp.className = "edit"; inp.value = t.text; inp.maxLength = 200;
  li.replaceChild(inp, span);
  inp.focus(); inp.select();
  const finish = commit => {
    const v = inp.value.trim();
    if (commit && v) t.text = v;
    store(); render();
  };
  inp.onblur = () => finish(true);
  inp.onkeydown = e => {
    if (e.key === "Enter") inp.blur();
    if (e.key === "Escape") { inp.onblur = null; finish(false); }
  };
}

$("form").onsubmit = e => {
  e.preventDefault();
  const v = $("input").value.trim();
  if (!v) return;
  tasks().push({ id: uid(), text: v, done: false, priority: $("priority").value, project: proj.sel === "all" ? undefined : proj.sel });
  $("input").value = "";
  save(); render();
};
$("calBtn").onclick = () => {
  calOpen = !calOpen;
  $("cal").hidden = !calOpen;
  $("calBtn").setAttribute("aria-expanded", calOpen);
  calView = current.slice(0, 7);
  render();
};
const moveCal = n => {
  const [y, m] = calView.split("-").map(Number);
  const dt = new Date(y, m - 1 + n, 1);
  calView = ymd(dt).slice(0, 7);
  renderCal();
};
$("calPrev").onclick = () => moveCal(-1);
$("calNext").onclick = () => moveCal(1);
$("prev").onclick = () => { current = shift(current, -1); render(); };
$("next").onclick = () => { current = shift(current, 1); render(); };
$("today").onclick = () => { current = ymd(new Date()); render(); };
$("clearDone").onclick = () => {
  data[current] = (data[current] || []).filter(t => !(t.done && inView(t)));
  save(); render();
};
$("carry").onclick = () => {
  const prev = (data[shift(current, -1)] || []).filter(t => !t.done && inView(t));
  const key = t => `${t.project || ""}|${t.text}`;
  const existing = new Set(tasks().map(key));
  let added = 0;
  for (const t of prev) {
    if (!existing.has(key(t))) {
      tasks().push({ id: uid(), text: t.text, done: false, priority: t.priority || "mid", project: t.project });
      added++;
    }
  }
  if (!added) alert("前一天沒有可帶入的未完成事項");
  save(); render();
};

/* ---------- 澆花小遊戲 ---------- */
const GKEY = "daily-todo-garden-v1";
const SPECIES = [
  { name: "向日葵", petal: "#f5c518", n: 14, pw: 5,  ph: 15, center: "#6b4423", cr: 10 },
  { name: "雛菊",   petal: "#ffffff", n: 12, pw: 4,  ph: 14, center: "#f2c230", cr: 8 },
  { name: "波斯菊", petal: "#f28cb1", n: 8,  pw: 8,  ph: 15, center: "#f2c230", cr: 6 },
  { name: "矢車菊", petal: "#5b8def", n: 10, pw: 4,  ph: 14, center: "#3b3b8f", cr: 7 },
  { name: "罌粟花", petal: "#e8503a", n: 6,  pw: 12, ph: 15, center: "#2b2b2b", cr: 6 },
  { name: "紫菀",   petal: "#a880d8", n: 16, pw: 3,  ph: 15, center: "#f2c230", cr: 7 },
];
const randSpecies = () => Math.floor(Math.random() * SPECIES.length);
// 階段 = floor(水滴 / 10)：0 種子、1 發芽、2/3/4 長高 1/2/3 公分（4 起有花苞）、5 小花、6 盛開
const STAGE = ["🌰 種子", "🌱 發芽", "🌿 幼苗", "🌿 幼苗", "🌷 花苞", "🌼 小花", "🌸 盛開"];
const HEIGHT = [0, 26, 48, 70, 92, 92, 92];
const CM = [0, 0, 1, 2, 3, 3, 3];
const PAIRS = [0, 0, 1, 2, 3, 3, 3];
const NEXT_GOAL = ["發芽", "長高到 1 公分", "長高到 2 公分", "長高到 3 公分並結出花苞", "開出小花", "完整開花"];
const CHEER = ["", "🌱 發芽了！", "📏 長高到 1 公分！", "📏 長高到 2 公分！", "🌷 3 公分了，長出花苞！", "🌼 開出小花了！", "🌸 完整開花！"];

let game = loadGame();
let pourTimer;

function loadGame() {
  try {
    const g = JSON.parse(localStorage.getItem(GKEY));
    if (g && typeof g.drops === "number") return g;
  } catch {}
  return { drops: 0, species: randSpecies(), garden: [] };
}
function saveGame() {
  try { localStorage.setItem(GKEY, JSON.stringify(game)); } catch {}
}

function flowerHead(sp, s, x, y) {
  const dist = (sp.cr + sp.ph * 0.7) * s;
  let out = "";
  for (let i = 0; i < sp.n; i++) {
    out += `<ellipse cx="${x}" cy="${y - dist}" rx="${sp.pw * s}" ry="${sp.ph * s}" fill="${sp.petal}" ` +
           `stroke="rgba(0,0,0,.18)" stroke-width=".6" transform="rotate(${(i * 360 / sp.n).toFixed(1)} ${x} ${y})"/>`;
  }
  return out + `<circle cx="${x}" cy="${y}" r="${sp.cr * s}" fill="${sp.center}"/>`;
}
function leaf(x, y, side, size) {
  return `<ellipse cx="${x + side * 10 * size}" cy="${y}" rx="${10 * size}" ry="${4 * size}" fill="#6fae5a" ` +
         `transform="rotate(${side * -30} ${x} ${y})"/>`;
}

function plantSVG(d) {
  const idx = Math.min(6, Math.floor(d / 10));
  const sp = SPECIES[game.species];
  const top = 196 - HEIGHT[idx];
  let s = `<g class="can"><rect x="140" y="30" width="40" height="28" rx="6" fill="#6f9fd0"/>` +
          `<polygon points="140,40 127,32 125,37 140,50" fill="#5a88b8"/>` +
          `<path d="M180 36 Q194 40 180 52" fill="none" stroke="#5a88b8" stroke-width="4"/></g>`;
  for (let i = 0; i < 4; i++) s += `<circle class="drop" cx="${118 + i * 4}" cy="${54 + (i % 2) * 4}" r="3" fill="#6fb6f0" style="animation-delay:${.35 + i * .12}s"/>`;
  s += `<path d="M70 205 L150 205 L142 252 L78 252 Z" fill="#c8794b"/>` +
       `<rect x="66" y="196" width="88" height="14" rx="4" fill="#d98b5c"/>` +
       `<ellipse cx="110" cy="197" rx="40" ry="6" fill="#5b4030"/>`;
  s += `<g class="pop">`;
  if (idx === 0) {
    s += `<ellipse cx="110" cy="195" rx="6" ry="4" fill="#9a7a44"/>`;
  } else {
    s += `<path d="M110 196 Q105 ${196 - HEIGHT[idx] / 2} 110 ${top}" fill="none" stroke="#5a9a4a" stroke-width="4" stroke-linecap="round"/>`;
    for (let i = 0; i < PAIRS[idx]; i++) {
      const y = 196 - HEIGHT[idx] * [0.28, 0.48, 0.68][i];
      s += leaf(110, y, i % 2 ? 1 : -1, 1.2) + leaf(110, y + 4, i % 2 ? -1 : 1, 1.2);
    }
    if (idx <= 3) s += leaf(110, top, -1, 0.9) + leaf(110, top, 1, 0.9);
    if (idx === 4) {
      s += `<ellipse cx="110" cy="${top - 8}" rx="8" ry="12" fill="${sp.petal}" stroke="rgba(0,0,0,.2)" stroke-width=".6"/>` +
           `<path d="M101 ${top - 6} Q110 ${top + 9} 119 ${top - 6} Q110 ${top - 2} 101 ${top - 6}Z" fill="#5a9a4a"/>`;
    } else if (idx === 5) s += flowerHead(sp, 0.55, 110, top);
    else if (idx === 6) s += flowerHead(sp, 1, 110, top);
  }
  return s + `</g>`;
}

function renderGame(opts = {}) {
  const d = game.drops;
  const idx = Math.min(6, Math.floor(d / 10));
  const svg = $("plant");
  svg.classList.remove("pour");
  svg.innerHTML = plantSVG(d);
  if (opts.pour) {
    svg.classList.add("pour");
    clearTimeout(pourTimer);
    pourTimer = setTimeout(() => svg.classList.remove("pour"), 1600);
  }
  $("gstage").textContent = STAGE[idx];
  $("gheight").textContent = idx === 0 ? "還在土裡沉睡…" : `高度：${CM[idx]} 公分`;
  $("gspecies").textContent = "品種：" + (idx >= 4 ? SPECIES[game.species].name : "？？？（長出花苞才知道）");
  $("gbar").style.width = (idx >= 6 ? 100 : (d % 10) * 10) + "%";
  $("gnext").textContent = idx >= 6 ? `💧 ${d}　已經完整開花啦！`
    : `💧 ${d}　再 ${(idx + 1) * 10 - d} 滴水 → ${NEXT_GOAL[idx]}`;
  $("harvest").hidden = idx < 6;

  const g = $("garden");
  g.innerHTML = `<div class="gt">🌼 我的花園（${game.garden.length}）</div>`;
  if (!game.garden.length) g.innerHTML += `<div class="gt">完整開花的花會收進這裡</div>`;
  for (const i of game.garden) {
    const sp = SPECIES[i];
    if (!sp) continue;
    const el = document.createElement("span");
    el.title = sp.name;
    el.innerHTML = `<svg viewBox="-38 -38 76 76">${flowerHead(sp, 1, 0, 0)}</svg>`;
    g.append(el);
  }
}

function waterPlant() {
  const before = Math.min(6, Math.floor(game.drops / 10));
  game.drops++;
  saveGame();
  renderGame({ pour: true });
  const after = Math.min(6, Math.floor(game.drops / 10));
  $("gmsg").textContent = after > before ? CHEER[after] : "💧 澆水 +1";
}

$("harvest").onclick = () => {
  game.garden.push(game.species);
  game.drops = Math.max(0, game.drops - 60);
  game.species = randSpecies();
  saveGame();
  renderGame();
  $("gmsg").textContent = "已收進花園，新的種子種下了 🌰";
};

// 舊資料：已完成的待辦視為已澆過水，避免一開始就白拿水滴
for (const k in data) for (const t of data[k]) if (t.done && t.watered === undefined) t.watered = true;

/* ---------- 週計畫 ---------- */
const WKEY = "daily-todo-weekly-v1";
const DAYS = "一二三四五六日";
const ST_ICON = { todo: "○", doing: "◐", done: "●" };
const ST_NEXT = { todo: "doing", doing: "done", done: "todo" };
const ST_LABEL = { todo: "未開始", doing: "進行中", done: "已完成" };
let weekly = {};
try { weekly = JSON.parse(localStorage.getItem(WKEY)) || {}; } catch {}
const wsave = () => { try { localStorage.setItem(WKEY, JSON.stringify(weekly)); } catch {} };

// 一週從星期一開始
function weekStart(s) {
  const [y, m, d] = s.split("-").map(Number);
  return ymd(new Date(y, m - 1, d - (new Date(y, m - 1, d).getDay() + 6) % 7));
}
const md = s => { const [, m, d] = s.split("-").map(Number); return `${m}/${d}`; };
const wtasks = () => (weekly[weekStart(current)] ||= []);

function scheduleTo(t, day) {
  t.days ||= [];
  if (!t.days.includes(day)) t.days.push(day);
  t.days.sort();
  const list = (data[day] ||= []);
  if (!list.some(x => x.wid === t.id)) {
    list.push({ id: uid(), text: t.text, done: false, priority: t.priority || "mid", wid: t.id, project: t.project });
  }
  save(); wsave(); render();
}

function renderWeekly() {
  const ws = weekStart(current);
  const all = weekly[ws] || [];
  const list = all.filter(inView);
  const done = list.filter(t => t.status === "done").length;
  $("wkTitle").textContent = `🗓️ ${ws === weekStart(ymd(new Date())) ? "本週" : "週"}計畫　${md(ws)} – ${md(shift(ws, 6))}`;
  $("wkCount").textContent = `已完成 ${done} / ${list.length}`;

  const ul = $("wList");
  ul.innerHTML = "";
  if (!list.length) {
    ul.innerHTML = '<div class="empty">這週還沒有計畫，先把想完成的事列出來吧</div>';
    return;
  }
  const sorted = [...list].sort((a, b) =>
    ((a.status === "done") - (b.status === "done")) || (RANK[a.priority || "mid"] - RANK[b.priority || "mid"]));
  for (const t of sorted) {
    const p = t.priority || "mid";
    const li = document.createElement("li");
    li.className = "p-" + p + (t.status === "done" ? " done" : "");

    const st = document.createElement("button");
    st.className = "st"; st.textContent = ST_ICON[t.status];
    st.title = `${ST_LABEL[t.status]}（點擊切換：未開始 → 進行中 → 已完成）`;
    st.onclick = () => { t.status = ST_NEXT[t.status]; wsave(); render(); };

    const span = document.createElement("span");
    span.textContent = t.text;
    span.title = "點兩下編輯";
    span.ondblclick = () => startEdit(li, span, t, wsave);

    const pri = document.createElement("button");
    pri.className = "pri " + p;
    pri.title = `優先順序：${LABEL[p]}（點擊切換）`;
    pri.setAttribute("aria-label", pri.title);
    pri.onclick = () => { t.priority = NEXT[p]; wsave(); render(); };

    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.setAttribute("aria-label", "刪除");
    del.onclick = () => { weekly[ws] = all.filter(x => x !== t); wsave(); render(); };

    const sub = document.createElement("div");
    sub.className = "wsub";
    const ptag = projTag(t, wsave);
    if (ptag) sub.append(ptag);
    if (t.status === "doing") {
      const tag = document.createElement("span");
      tag.className = "tag"; tag.textContent = "進行中";
      sub.append(tag);
    }
    for (const day of t.days || []) {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = `週${DAYS[(new Date(day.replace(/-/g, "/")).getDay() + 6) % 7]} ${md(day)}`;
      chip.title = "前往這一天";
      chip.onclick = () => { current = day; render(); };
      sub.append(chip);
    }
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", "排到某一天");
    sel.innerHTML = '<option value="">＋ 排到某天…</option>';
    for (let i = 0; i < 7; i++) {
      const day = shift(ws, i);
      sel.innerHTML += `<option value="${day}">週${DAYS[i]} ${md(day)}</option>`;
    }
    sel.onchange = () => { if (sel.value) scheduleTo(t, sel.value); };
    sub.append(sel);

    li.append(st, span, pri, del, sub);
    ul.append(li);
  }
}

$("wkBtn").onclick = () => {

  $("wkBtn").setAttribute("aria-expanded", open);
};

$("wForm").onsubmit = e => {

};

};
$("wCarry").onclick = () => {

/* ---------- 月曆模式（每日行程） ---------- */
const EKEY = "daily-todo-events-v1";
const MKEY = "daily-todo-mode-v1";
let events = {};
try { events = JSON.parse(localStorage.getItem(EKEY)) || {}; } catch {}
const esave = () => { try { localStorage.setItem(EKEY, JSON.stringify(events)); } catch {} };
let mode = "list";
try { if (localStorage.getItem(MKEY) === "month") mode = "month"; } catch {}
let mView = current.slice(0, 7); // "YYYY-MM"
let dayOpen = null;
document.body.classList.toggle("month", mode === "month");
$("modeList").setAttribute("aria-pressed", mode === "list");
$("modeMonth").setAttribute("aria-pressed", mode === "month");

const dayEvents = key => [...(events[key] || [])].sort((a, b) => (a.time || "").localeCompare(b.time || ""));
const evLabel = e => (e.time ? e.time + " " : "") + e.text;

function setMode(m) {
  mode = m;
  try { localStorage.setItem(MKEY, m); } catch {}
  document.body.classList.toggle("month", m === "month");
  $("modeList").setAttribute("aria-pressed", m === "list");

}
$("modeList").onclick = () => setMode("list");
$("modeMonth").onclick = () => setMode("month");

function renderMonth() {
  if (mode !== "month") return;
  const [y, m] = mView.split("-").map(Number);
  $("mTitle").textContent = `${y} 年 ${m} 月`;
  const grid = $("mGrid");
  grid.innerHTML = "";
  for (const w of "日一二三四五六") {
    const el = document.createElement("div");
    el.className = "mwd"; el.textContent = w;
    grid.append(el);
  }
  const first = new Date(y, m - 1, 1).getDay();
  const rows = Math.ceil((first + new Date(y, m, 0).getDate()) / 7);
  const todayStr = ymd(new Date());
  for (let i = 0; i < rows * 7; i++) {
    const dt = new Date(y, m - 1, 1 - first + i);
    const key = ymd(dt);
    const evs = dayEvents(key);
    const cell = document.createElement("button");
    cell.className = "mcell" + (dt.getMonth() !== m - 1 ? " out" : "") + (key === todayStr ? " today" : "");
    cell.setAttribute("aria-label", `${dt.getMonth() + 1} 月 ${dt.getDate()} 日，${evs.length} 個行程`);
    const dn = document.createElement("span");
    dn.className = "dn"; dn.textContent = dt.getDate();
    cell.append(dn);
    for (const e of evs.slice(0, 3)) {
      const p = document.createElement("span");
      p.className = "ev"; p.textContent = evLabel(e); p.title = evLabel(e);
      cell.append(p);
    }
    if (evs.length > 3) {
      const more = document.createElement("span");
      more.className = "more"; more.textContent = `還有 ${evs.length - 3} 項…`;
      cell.append(more);
    }
    cell.onclick = () => openDay(key);
    grid.append(cell);
  }
}

function moveMonth(n) {
  const [y, m] = mView.split("-").map(Number);
  mView = ymd(new Date(y, m - 1 + n, 1)).slice(0, 7);
  renderMonth();
}
$("mPrev").onclick = () => moveMonth(-1);
$("mNext").onclick = () => moveMonth(1);
$("mToday").onclick = () => { mView = ymd(new Date()).slice(0, 7); renderMonth(); };

function openDay(key) {
  dayOpen = key;
  renderDayList();
  $("dayDialog").showModal();
  $("dText").focus();
}
function renderDayList() {
  const [y, m, d] = dayOpen.split("-").map(Number);
  $("dTitle").textContent = `${m} 月 ${d} 日　星期${"日一二三四五六"[new Date(y, m - 1, d).getDay()]}`;
  const ul = $("dList");
  ul.innerHTML = "";
  const list = dayEvents(dayOpen);
  if (!list.length) {
    ul.innerHTML = '<div class="empty">這天還沒有行程</div>';
    return;
  }
  for (const e of list) {
    const li = document.createElement("li");
    const time = document.createElement("span");
    time.className = "etime"; time.textContent = e.time || "全天";
    const span = document.createElement("span");
    span.textContent = e.text; span.title = "點兩下編輯";
    span.ondblclick = () => startEdit(li, span, e, esave);
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.setAttribute("aria-label", "刪除");
    del.onclick = () => { events[dayOpen] = events[dayOpen].filter(x => x !== e); esave(); render(); };
    li.append(time, span, del);
    ul.append(li);
  }
}
$("dForm").onsubmit = e => {
  e.preventDefault();
  const text = $("dText").value.trim();
  if (!text) return;
  (events[dayOpen] ||= []).push({ id: uid(), time: $("dTime").value, text });
  $("dText").value = ""; $("dTime").value = "";
  esave(); render();
  $("dText").focus();
};
$("dClose").onclick = () => $("dayDialog").close();
$("dayDialog").onclose = () => { dayOpen = null; };
$("dToList").onclick = () => {
  current = dayOpen;
  $("dayDialog").close();
  setMode("list");
};
